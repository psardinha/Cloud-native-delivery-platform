apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "full-stack-observability.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "full-stack-observability.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "full-stack-observability.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "full-stack-observability.selectorLabels" . | nindent 8 }}

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001

      containers:
        - name: full-stack-observability
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterOtlpEndpoint | quote }}

            - name: OTEL_PROXY_COLLECTOR_URL
              value: {{ .Values.otel.proxyCollectorUrl | quote }}

            - name: CORS_ORIGINS
              value: {{ .Values.cors.origins | quote }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3