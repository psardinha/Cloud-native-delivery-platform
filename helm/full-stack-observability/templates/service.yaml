apiVersion: v1
kind: Service
metadata:
  name: {{ include "full-stack-observability.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "full-stack-observability.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "full-stack-observability.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
